version: '3.7'

services:

  redis:
    image: redis:alpine
    restart: "no"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION}
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION}
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  # We have a Logstash “agent”, which acts like a logs buffer.
  logstash-agent:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION}
    volumes:
      - ./logstash/logstash_agent.conf:/usr/share/logstash/pipeline/logstash_agent.conf
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch

  # We have a Logstash “central” Logstash container reads logs from the Redis buffer and shoves them into Elasticsearch.
  logstash-central:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION}
    volumes:
      - ./logstash/logstash_center.conf:/usr/share/logstash/pipeline/logstash_center.conf
    depends_on:
      - elasticsearch

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELK_VERSION}
    user: root
    command: ["--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - logstash-agent
      - logstash-central

  # laravel with nginx
  laravel:
    build: ./
    container_name: laravel_app
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
    entrypoint: /bin/sh -c " \
      chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache && \
      chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache && \
      if [ -f /var/www/html/storage/database/database.sqlite ]; then \
      chown www-data:www-data /var/www/html/storage/database/database.sqlite && \
      chmod 775 /var/www/html/storage/database/database.sqlite; \
      fi && \
      php-fpm"
    expose:
      - "9000"
    depends_on:
      - filebeat
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_laravel
    ports:
      - "8000:80"
    volumes:
      - ./laravel:/var/www/html
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - laravel
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  #  # laravel without nginx (with artisan serve)
  #  laravel:
  #    build: ./
  #    container_name: laravel_app
  #    working_dir: /var/www/html
  #    volumes:
  #      - ./laravel:/var/www/html
  #    command: >
  #      sh -c "composer install &&
  #             php artisan serve --host=0.0.0.0 --port=8000"
  #    ports:
  #      - "8000:8000"
  #    depends_on:
  #      - filebeat
  #    environment:
  #      - COMPOSER_ALLOW_SUPERUSER=1
  #    logging:
  #      driver: "json-file"
  #      options:
  #        max-size: "10m"
  #        max-file: "5"

volumes:
  esdata:
